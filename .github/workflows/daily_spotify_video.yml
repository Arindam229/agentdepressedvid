name: Daily Spotify AI Video Pipeline

on:
  schedule:
    # Runs daily at 12:00 UTC (5:30 PM IST)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI

jobs:
  run-spotify-video-pipeline:
    name: Run Spotify AI Video Generation & YouTube Upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp google-api-python-client google-auth-oauthlib google-auth-httplib2 pillow

      - name: Restore YouTube OAuth Token from Secrets
        env:
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
        run: |
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 --decode > token.pickle
            echo "Successfully restored token.pickle from secrets."
          else
            echo "Warning: YOUTUBE_TOKEN_BASE64 secret is not set!"
          fi

      - name: Run Video Pipeline & Upload to YouTube
        run: |
          # Usage: python ai_video_pipeline.py <PLAYLIST_URL> <IMAGE_PATH> --upload
          python ai_video_pipeline.py "https://open.spotify.com/playlist/3WYcoszlfcLRB3lbHEhN5i" "agentforchatvid/Gemini_Generated_Image_azeja3azeja3azej.png" --upload
