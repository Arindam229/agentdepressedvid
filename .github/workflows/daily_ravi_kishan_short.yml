name: Daily Ravi Kishan Meme Short Pipeline

on:
  schedule:
    # Runs daily at 14:00 UTC (7:30 PM IST)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI

jobs:
  run-ravi-kishan-short-pipeline:
    name: Upload Daily Ravi Kishan Short to YouTube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Restore YouTube OAuth Token from Secrets
        env:
          RAVI_KISHAN_TOKEN_BASE64: ${{ secrets.RAVI_KISHAN_TOKEN_BASE64 }}
        run: |
          if [ -n "$RAVI_KISHAN_TOKEN_BASE64" ]; then
            echo "$RAVI_KISHAN_TOKEN_BASE64" | base64 --decode > token_ravi_kishan.pickle
            echo "Successfully restored token_ravi_kishan.pickle from secrets."
          else
            echo "Warning: RAVI_KISHAN_TOKEN_BASE64 secret is not set!"
          fi

      - name: Run Short Pipeline & Upload to YouTube
        run: |
          python daily_ravi_kishan_short.py --upload
