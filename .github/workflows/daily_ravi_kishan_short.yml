name: Daily Ravi Kishan Meme Short Pipeline

on:
  schedule:
    # Runs daily at 14:00 UTC (7:30 PM IST)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI

jobs:
  run-ravi-kishan-short-pipeline:
    name: Upload Daily Ravi Kishan Short to YouTube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Restore YouTube OAuth Token from Secrets
        env:
          RAVI_KISHAN_TOKEN_BASE64: ${{ secrets.RAVI_KISHAN_TOKEN_BASE64 }}
        run: |
          python -c "import base64, os; data = os.environ.get('RAVI_KISHAN_TOKEN_BASE64', '').strip(); raw = base64.b64decode(data) if data else b''; open('token_ravi_kishan.json', 'wb').write(raw) if raw.startswith(b'{') else open('token_ravi_kishan.pickle', 'wb').write(raw) if raw else print('Warning: RAVI_KISHAN_TOKEN_BASE64 is not set!')"
          if [ -f token_ravi_kishan.json ] || [ -f token_ravi_kishan.pickle ]; then echo "Successfully restored YouTube OAuth token credentials."; fi

      - name: Run Short Pipeline & Upload to YouTube
        run: |
          python daily_ravi_kishan_short.py --upload
